[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-secret-scanner"
version = "0.2.0"
description = "CLI that finds committed secrets and, optionally, personal data, with masked output and CI exit codes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Saina Kakkar" }]
dependencies = []

[project.scripts]
secret-scanner = "secret_scanner.cli:main"
pii-secret-scanner = "secret_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
